<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Кофейная Смена</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Manrope:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: смена-лист точки — вкладки Обзор / Смены / Списания / Выручка, сводка сверху */
:root{
  --bg:#f3f5f3; --panel:#ffffff; --ink:#23191a; --muted:#6d6466; --line:#dcdfdc;
  --accent:#0f6f68; --accent-soft:#dcefed; --crema:#b86a1e; --crema-soft:#f6e6d4;
  --ok:#1f7a4d; --bad:#b3261e; --bad-soft:#fbe3e1;
  --f-display:"Yeseva One", Georgia, serif;
  --f-body:"Manrope", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141112; --panel:#1e1a1b; --ink:#efe8e6; --muted:#a59c9d; --line:#342d2e;
  --accent:#5cc8bd; --accent-soft:#1a3432; --crema:#e5a15c; --crema-soft:#3a2a19;
  --ok:#6fd3a0; --bad:#ff8c84; --bad-soft:#3a1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141112; --panel:#1e1a1b; --ink:#efe8e6; --muted:#a59c9d; --line:#342d2e;
  --accent:#5cc8bd; --accent-soft:#1a3432; --crema:#e5a15c; --crema-soft:#3a2a19;
  --ok:#6fd3a0; --bad:#ff8c84; --bad-soft:#3a1c1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:12px}
h1{font:400 clamp(28px,5vw,40px)/1 var(--f-display);margin:0}
h2{font:400 22px var(--f-display);margin:0}
.sub{color:var(--muted);margin:6px 0 0}
.mode{font:12px var(--f-mono);color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:4px 8px}
button,input,select{font:inherit;color:inherit}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;font-weight:700;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kpi b{display:block;font:600 24px var(--f-mono);font-variant-numeric:tabular-nums}
.kpi small{color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
@media (max-width:780px){.grid2{grid-template-columns:minmax(0,1fr)}}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:480px;height:auto}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.reasons{display:grid;gap:8px}
.reason{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;font-size:14px}
.reason .b{grid-column:1/-1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.reason .b i{display:block;height:100%;background:var(--crema)}
.reason em{font:600 13px var(--f-mono);font-style:normal;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tbl{overflow-x:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-transform:none;letter-spacing:0}
.btn{background:var(--accent);color:var(--panel);border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:2px 6px}
.x:hover{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.week{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:8px;overflow-x:auto}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:6px;align-content:start;min-height:120px}
.day.today{border-color:var(--accent)}
.day h3{margin:0;font-size:13px;font-weight:700}
.shift{background:var(--accent-soft);border-radius:6px;padding:6px 8px;font-size:13px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:start}
.shift span{font:12px var(--f-mono);color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.muted{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:24px;border:1px dashed var(--line);border-radius:10px}
.tag{font:600 11px var(--f-mono);background:var(--crema-soft);color:var(--crema);padding:2px 6px;border-radius:4px}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Кофейная Смена</h1>
      <p class="sub">Смены бариста, списания и выручка точки в одном месте</p>
    </div>
    <span class="mode" id="mode">подключение…</span>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="overview" aria-selected="true">Обзор</button>
    <button role="tab" data-tab="shifts" aria-selected="false">Смены</button>
    <button role="tab" data-tab="writeoffs" aria-selected="false">Списания</button>
    <button role="tab" data-tab="revenue" aria-selected="false">Выручка</button>
  </nav>
  <main id="view"></main>
</div>

<script>
const REASONS=["Истёк срок","Брак / порча","Ошибка приготовления","Дегустация / проработка","Другое"];
const iso=d=>d.toISOString().slice(0,10);
const addD=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return iso(d)};
const today=iso(new Date());
const rub=n=>Math.round(n).toLocaleString("ru-RU")+" ₽";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
const wd=d=>new Date(d+"T12:00:00").toLocaleDateString("ru-RU",{weekday:"short"});
const $=id=>document.getElementById(id);

let db=null,canWrite=true,tab="overview",weekStart=monday(today);
let S={days:[],writeoffs:[],shifts:[]};
function monday(s){const d=new Date(s+"T12:00:00");const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)}

function demo(){
  const days=[],w=[],sh=[];const staff=["Аня","Илья","Катя"];
  for(let i=13;i>=0;i--){const d=addD(today,-i);const base=36000+ (13-i)*600;const rev=base+((i*7919)%5000);const checks=Math.round(rev/(280+(13-i)*2.3));days.push({id:"d"+d,date:d,revenue:rev,checks,example:true})}
  const items=[["Молоко 3,2%",2,"л",180,0],["Круассаны",4,"шт",95,0],["Сироп карамель",1,"шт",420,1],["Латте (переделка)",2,"шт",110,2],["Эспрессо (проработка)",3,"шт",40,3],["Чизкейк",1,"шт",210,0]];
  items.forEach((x,k)=>w.push({id:"w"+k,date:addD(today,-k*2),item:x[0],qty:x[1],unit:x[2],cost:x[1]*x[3],reason:REASONS[x[4]],example:true}));
  for(let i=0;i<7;i++){const d=addD(weekStart,i);sh.push({id:"s"+i+"a",date:d,person:staff[i%3],start:"07:30",end:"15:30",example:true});sh.push({id:"s"+i+"b",date:d,person:staff[(i+1)%3],start:"14:30",end:"22:00",example:true})}
  return {days,writeoffs:w,shifts:sh};
}

function render(){if(!db&&S.days.length+S.shifts.length+S.writeoffs.length){try{localStorage.setItem("cs_state",JSON.stringify(S))}catch{}}
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  $("view").innerHTML={overview,shifts,writeoffs,revenue}[tab]();
}

function stats(){
  const d=[...S.days].sort((a,b)=>a.date.localeCompare(b.date));
  const last7=d.filter(x=>x.date>addD(today,-7)),prev7=d.filter(x=>x.date<=addD(today,-7)&&x.date>addD(today,-14));
  const avg=a=>a.length?a.reduce((s,x)=>s+x.revenue,0)/a.length:0;
  const chk=a=>{const r=a.reduce((s,x)=>s+x.revenue,0),c=a.reduce((s,x)=>s+(x.checks||0),0);return c?r/c:0};
  const wo=S.writeoffs.filter(x=>x.date>addD(today,-30));
  return {d,a7:avg(last7),p7:avg(prev7),c7:chk(last7),pc7:chk(prev7),wo30:wo.reduce((s,x)=>s+(+x.cost||0),0),wo};
}
const delta=(a,b)=>b?((a-b)/b*100):0;
const dTxt=(v,inv)=>{if(!isFinite(v)||v===0)return"";const good=inv?v<0:v>0;return `<small style="color:var(${good?"--ok":"--bad"})">${v>0?"+":""}${v.toFixed(1)}% к пред. неделе</small>`};

function overview(){
  const s=stats();
  const kp=`<section class="kpis">
    <div class="kpi"><span>Средняя выручка / день</span><b>${rub(s.a7)}</b>${dTxt(delta(s.a7,s.p7))}</div>
    <div class="kpi"><span>Средний чек</span><b>${rub(s.c7)}</b>${dTxt(delta(s.c7,s.pc7))}</div>
    <div class="kpi"><span>Списания за 30 дней</span><b>${rub(s.wo30)}</b><small>${s.wo.length} позиций</small></div>
    <div class="kpi"><span>Смен на этой неделе</span><b>${S.shifts.filter(x=>x.date>=monday(today)&&x.date<addD(monday(today),7)).length}</b><small>${new Set(S.shifts.map(x=>x.person)).size} сотрудника в графике</small></div>
  </section>`;
  const byR=REASONS.map(r=>({r,v:s.wo.filter(x=>x.reason===r).reduce((a,x)=>a+(+x.cost||0),0)})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const mx=Math.max(1,...byR.map(x=>x.v));
  return kp+`<div class="grid2" style="margin-top:16px">
    <section class="panel"><h2>Выручка за 14 дней</h2>${chart(s.d.slice(-14))}</section>
    <section class="panel"><h2>Списания по причинам</h2>${byR.length?`<div class="reasons">${byR.map(x=>`<div class="reason"><span>${esc(x.r)}</span><em>${rub(x.v)}</em><div class="b"><i style="width:${x.v/mx*100}%"></i></div></div>`).join("")}</div>`:`<div class="empty">За 30 дней списаний нет.</div>`}</section>
  </div>`;
}

function chart(d){
  if(!d.length)return `<div class="empty">Добавьте выручку на вкладке «Выручка» — здесь появится график.</div>`;
  const W=640,H=240,L=52,B=28,T=12,max=Math.ceil(Math.max(...d.map(x=>x.revenue))/10000)*10000||10000;
  const bw=(W-L-8)/d.length,y=v=>T+(H-T-B)*(1-v/max);
  const ticks=[0,max/2,max].map(v=>`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v/1000}k</text>`).join("");
  const bars=d.map((x,i)=>`<rect x="${L+i*bw+3}" y="${y(x.revenue)}" width="${bw-6}" height="${H-B-y(x.revenue)}" rx="3" fill="${i===d.length-1?"var(--accent)":"var(--crema)"}" opacity="${i===d.length-1?1:.75}"><title>${fmt(x.date)}: ${rub(x.revenue)}</title></rect>${i%2===d.length%2?"":`<text x="${L+i*bw+bw/2}" y="${H-8}" text-anchor="middle">${fmt(x.date)}</text>`}`).join("");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Выручка по дням">${ticks}${bars}</svg></div>`;
}

function shifts(){
  const days=[...Array(7)].map((_,i)=>addD(weekStart,i));
  return `<section class="panel">
    <div class="row" style="justify-content:space-between"><h2>График смен</h2>
      <div class="row"><button class="btn" style="background:transparent;color:var(--accent);border:1px solid var(--line)" data-wk="-7">←</button><span class="muted">${fmt(days[0])} — ${fmt(days[6])}</span><button class="btn" style="background:transparent;color:var(--accent);border:1px solid var(--line)" data-wk="7">→</button></div></div>
    <div class="week">${days.map(d=>`<div class="day ${d===today?"today":""}"><h3>${wd(d)}, ${fmt(d)}</h3>${S.shifts.filter(x=>x.date===d).sort((a,b)=>a.start.localeCompare(b.start)).map(x=>`<div class="shift"><div>${esc(x.person)}<br><span>${esc(x.start)}–${esc(x.end)}</span></div>${canWrite?`<button class="x" aria-label="Удалить смену" data-del="shifts:${x.id}">×</button>`:""}</div>`).join("")||'<span class="muted">Нет смен</span>'}</div>`).join("")}</div>
    ${canWrite?`<form class="form" data-form="shifts">
      <label>Дата<input type="date" id="shDate" name="date" required value="${today}"></label>
      <label>Сотрудник<input type="text" id="shPerson" name="person" required placeholder="Имя"></label>
      <label>Начало<input type="time" id="shStart" name="start" required value="07:30"></label>
      <label>Конец<input type="time" id="shEnd" name="end" required value="15:30"></label>
      <button class="btn">Добавить смену</button></form>`:""}
  </section>`;
}

function writeoffs(){
  const l=[...S.writeoffs].sort((a,b)=>b.date.localeCompare(a.date));
  return `<section class="panel"><h2>Журнал списаний</h2>
    ${canWrite?`<form class="form" data-form="writeoffs">
      <label>Дата<input type="date" id="woDate" name="date" required value="${today}"></label>
      <label>Позиция<input type="text" id="woItem" name="item" required placeholder="Молоко 3,2%"></label>
      <label>Кол-во<input type="number" id="woQty" name="qty" min="0" step="0.1" required value="1"></label>
      <label>Ед.<select id="woUnit" name="unit"><option>шт</option><option>л</option><option>кг</option></select></label>
      <label>Сумма, ₽<input type="number" id="woCost" name="cost" min="0" required></label>
      <label>Причина<select id="woReason" name="reason">${REASONS.map(r=>`<option>${r}</option>`).join("")}</select></label>
      <button class="btn">Списать</button></form>`:""}
    ${l.length?`<div class="tbl"><table><thead><tr><th>Дата</th><th>Позиция</th><th>Причина</th><th style="text-align:right">Кол-во</th><th style="text-align:right">Сумма</th><th></th></tr></thead><tbody>
    ${l.map(x=>`<tr><td>${fmt(x.date)}</td><td>${esc(x.item)} ${x.example?'<span class="tag">пример</span>':""}</td><td>${esc(x.reason)}</td><td class="num">${esc(x.qty)} ${esc(x.unit)}</td><td class="num">${rub(+x.cost||0)}</td><td>${canWrite?`<button class="x" aria-label="Удалить" data-del="writeoffs:${x.id}">×</button>`:""}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">Списаний пока нет. Заполните форму выше.</div>`}
  </section>`;
}

function revenue(){
  const l=[...S.days].sort((a,b)=>b.date.localeCompare(a.date));
  return `<section class="panel"><h2>Выручка по дням</h2>
    ${canWrite?`<form class="form" data-form="days">
      <label>Дата<input type="date" id="rvDate" name="date" required value="${today}"></label>
      <label>Выручка, ₽<input type="number" id="rvRev" name="revenue" min="0" required placeholder="42000"></label>
      <label>Чеков<input type="number" id="rvChecks" name="checks" min="0" required placeholder="140"></label>
      <button class="btn">Сохранить день</button></form><p class="muted">Повторная запись за ту же дату заменит прежнюю.</p>`:""}
    ${l.length?`<div class="tbl"><table><thead><tr><th>Дата</th><th style="text-align:right">Выручка</th><th style="text-align:right">Чеков</th><th style="text-align:right">Средний чек</th><th></th></tr></thead><tbody>
    ${l.map(x=>`<tr><td>${wd(x.date)}, ${fmt(x.date)} ${x.example?'<span class="tag">пример</span>':""}</td><td class="num">${rub(x.revenue)}</td><td class="num">${x.checks||0}</td><td class="num">${x.checks?rub(x.revenue/x.checks):"—"}</td><td>${canWrite?`<button class="x" aria-label="Удалить" data-del="days:${x.id}">×</button>`:""}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">Нет данных о выручке.</div>`}
  </section>`;
}

async function put(col,id,body){
  if(!db){const a=S[col],i=a.findIndex(x=>x.id===id);i>=0?a[i]={id,...body}:a.push({id,...body});render();return}
  try{await db.collection(col).doc(id).set(body)}catch(e){$("mode").textContent="ошибка сохранения: "+(e.code||"")}
}
async function del(col,id){
  if(!db){S[col]=S[col].filter(x=>x.id!==id);render();return}
  try{await db.collection(col).doc(id).delete()}catch(e){$("mode").textContent="ошибка удаления"}
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render()}
  else if(b.dataset.wk){weekStart=addD(weekStart,+b.dataset.wk);render()}
  else if(b.dataset.del){const[c,i]=b.dataset.del.split(":");del(c,i)}
});
document.addEventListener("submit",e=>{
  const f=e.target,col=f.dataset.form;if(!col)return;e.preventDefault();
  const v=Object.fromEntries(new FormData(f));
  if(col==="days"){put("days","d"+v.date,{date:v.date,revenue:+v.revenue,checks:+v.checks})}
  else if(col==="writeoffs"){put("writeoffs","w"+Date.now().toString(36),{...v,qty:+v.qty,cost:+v.cost})}
  else {put("shifts","s"+Date.now().toString(36),v)}
  f.reset();
});

render();
(async()=>{
  try{db=await window.claude?.use?.("db")}catch{db=null}
  if(!db){db=null;try{S=JSON.parse(localStorage.getItem("cs_state"))}catch{}if(!S||!S.days)S=demo();$("mode").textContent="данные хранятся в этом браузере";render();return}
  let u=null;try{u=await claude.use("user")}catch{}
  const w=u?await u.can("data.write"):null;canWrite=w!==false;
  $("mode").textContent=canWrite?"общая база · синхронизация":"только просмотр";
  for(const c of ["days","writeoffs","shifts"]){
    db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{$("mode").textContent="нет связи с базой"});
  }
})();
</script>

</html>
